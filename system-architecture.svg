<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6B4F09"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#FAFAF5"/>

  <!-- Title -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A1A1A">UAV-01 Avionics Beacon &amp; RADAR Contact Monitor</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#6B4F09">System architecture — App 1 (blink/web) + App 3 (ISR/bottom-half)</text>

  <!-- Core 0 region -->
  <rect x="30" y="80" width="420" height="520" rx="10" fill="#FFFFFF" stroke="#E5DCC3" stroke-width="2"/>
  <text x="240" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#6B4F09">Core 0 (PRO_CPU)</text>

  <rect x="60" y="130" width="360" height="70" rx="6" fill="#FFF3B0" stroke="#B89B1E"/>
  <text x="240" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">Wi-Fi station driver</text>
  <text x="240" y="176" text-anchor="middle" font-size="11" fill="#4A4A4A">Wokwi-GUEST STA connection</text>

  <rect x="60" y="220" width="360" height="130" rx="6" fill="#FFF3B0" stroke="#B89B1E"/>
  <text x="240" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">HTTP server task (pri 5)</text>
  <text x="240" y="266" text-anchor="middle" font-size="11" fill="#4A4A4A">handle_root() — dashboard HTML + JS</text>
  <text x="240" y="284" text-anchor="middle" font-size="11" fill="#4A4A4A">handle_state() — JSON snapshot, polled 4 Hz</text>
  <text x="240" y="304" text-anchor="middle" font-size="11" fill="#4A4A4A">reads: led_on, toggle_count, presses_observed,</text>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#4A4A4A">radar_hit_count, latency_last/max (sem &amp; notif)</text>

  <rect x="60" y="380" width="360" height="90" rx="6" fill="#F5EFDC" stroke="#B89B1E" stroke-dasharray="4,3"/>
  <text x="240" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#6B4F09">Browser dashboard</text>
  <text x="240" y="424" text-anchor="middle" font-size="11" fill="#4A4A4A">Beacon status + RADAR contact panel</text>
  <text x="240" y="442" text-anchor="middle" font-size="11" fill="#4A4A4A">fetch('/state') every 250 ms</text>

  <!-- Core 1 region -->
  <rect x="490" y="80" width="480" height="520" rx="10" fill="#FFFFFF" stroke="#E5DCC3" stroke-width="2"/>
  <text x="730" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#6B4F09">Core 1 (APP_CPU)</text>

  <rect x="520" y="130" width="420" height="70" rx="6" fill="#E7F3EA" stroke="#1B6A2E"/>
  <text x="730" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">blink_task (pri 5, periodic 1000 ms)</text>
  <text x="730" y="176" text-anchor="middle" font-size="11" fill="#4A4A4A">writes: led_on, toggle_count · vTaskDelayUntil</text>

  <rect x="520" y="220" width="420" height="80" rx="6" fill="#FBE7E7" stroke="#B81829"/>
  <text x="730" y="246" text-anchor="middle" font-size="13" font-weight="600" fill="#1A1A1A">button_isr()  — HW interrupt context</text>
  <text x="730" y="264" text-anchor="middle" font-size="11" fill="#4A4A4A">GPIO 18 NEGEDGE, 200 &#181;s debounce, IRAM_ATTR</text>
  <text x="730" y="282" text-anchor="middle" font-size="11" fill="#4A4A4A">writes isr_entry_time_us, presses_observed; pulses GPIO 19</text>

  <rect x="520" y="330" width="195" height="110" rx="6" fill="#E7EEF7" stroke="#1B3A6A"/>
  <text x="617" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">btn_task_sem</text>
  <text x="617" y="372" text-anchor="middle" font-size="10.5" fill="#4A4A4A">Core 1, pri 12</text>
  <text x="617" y="390" text-anchor="middle" font-size="10.5" fill="#4A4A4A">wakes on binary semaphore</text>
  <text x="617" y="408" text-anchor="middle" font-size="10.5" fill="#4A4A4A">writes radar_hit_count,</text>
  <text x="617" y="424" text-anchor="middle" font-size="10.5" fill="#4A4A4A">latency_*_sem_us</text>

  <rect x="745" y="330" width="195" height="110" rx="6" fill="#E7EEF7" stroke="#1B3A6A"/>
  <text x="842" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#1A1A1A">btn_task_notif</text>
  <text x="842" y="372" text-anchor="middle" font-size="10.5" fill="#4A4A4A">Core 1, pri 12</text>
  <text x="842" y="390" text-anchor="middle" font-size="10.5" fill="#4A4A4A">wakes on task notification</text>
  <text x="842" y="408" text-anchor="middle" font-size="10.5" fill="#4A4A4A">writes</text>
  <text x="842" y="424" text-anchor="middle" font-size="10.5" fill="#4A4A4A">latency_*_notif_us</text>

  <rect x="520" y="470" width="420" height="110" rx="6" fill="#F5EFDC" stroke="#B89B1E" stroke-dasharray="4,3"/>
  <text x="730" y="494" text-anchor="middle" font-size="12" font-weight="600" fill="#6B4F09">Shared volatile state (no mutex)</text>
  <text x="730" y="514" text-anchor="middle" font-size="10.5" fill="#4A4A4A">led_on · toggle_count · isr_entry_time_us · presses_observed</text>
  <text x="730" y="532" text-anchor="middle" font-size="10.5" fill="#4A4A4A">radar_hit_count · latency_last/max_sem_us · latency_last/max_notif_us</text>
  <text x="730" y="554" text-anchor="middle" font-size="10.5" fill="#4A4A4A">Single-word reads/writes — atomic on Xtensa, benign-racy across fields</text>

  <!-- Arrows: HTTP reads shared state -->
  <path d="M 450 495 L 520 525" stroke="#6B4F09" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="490" font-size="10" fill="#6B4F09">reads</text>

  <!-- Arrows: blink writes to shared state -->
  <path d="M 730 200 L 730 470" stroke="#1B6A2E" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="738" y="330" font-size="10" fill="#1B6A2E">writes</text>

  <!-- Arrows: ISR signals both bottom-half tasks -->
  <path d="M 680 300 L 630 330" stroke="#B81829" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 780 300 L 830 330" stroke="#B81829" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="315" font-size="10" fill="#B81829">sem give</text>
  <text x="815" y="315" font-size="10" fill="#B81829">notify</text>

  <!-- Arrows: bottom-half tasks write shared state -->
  <path d="M 617 440 L 660 470" stroke="#1B3A6A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 842 440 L 800 470" stroke="#1B3A6A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="60" y="500" width="360" height="80" rx="6" fill="#FFFFFF" stroke="#E5DCC3"/>
  <text x="240" y="522" text-anchor="middle" font-size="11" font-weight="600" fill="#6B4F09">Legend</text>
  <rect x="80" y="532" width="14" height="14" fill="#FFF3B0" stroke="#B89B1E"/>
  <text x="100" y="543" font-size="10.5" fill="#1A1A1A">Core 0 network/HTTP</text>
  <rect x="80" y="551" width="14" height="14" fill="#E7F3EA" stroke="#1B6A2E"/>
  <text x="100" y="562" font-size="10.5" fill="#1A1A1A">Periodic task</text>
  <rect x="250" y="532" width="14" height="14" fill="#FBE7E7" stroke="#B81829"/>
  <text x="270" y="543" font-size="10.5" fill="#1A1A1A">HW interrupt</text>
  <rect x="250" y="551" width="14" height="14" fill="#E7EEF7" stroke="#1B3A6A"/>
  <text x="270" y="562" font-size="10.5" fill="#1A1A1A">Bottom-half task</text>
</svg>
